# ============================================
# APPLICATION CONFIGURATION FOR KUBERNETES
# ============================================
# Este archivo se activa con: -Dspring.profiles.active=kubernetes
# Las variables ${} se reemplazan con variables de entorno

# ============================================
# SERVER CONFIGURATION
# ============================================
server:
  port: 8085

spring:
  application:
    name: delivery-service

  # ============================================
  # DATASOURCE CONFIGURATION
  # ============================================
  # Estas variables vienen de ConfigMap y Secrets de Kubernetes
  datasource:
    url: jdbc:postgresql://localhost:5436/deliverydb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    # ============================================
    # CONNECTION POOL
    # ============================================
    hikari:
      maximum-pool-size: ${POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 20000

  # ============================================
  # JPA CONFIGURATION
  # ============================================
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
        jdbc:
          lob:
            "[non_contextual_creation]": true
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
  # ============================================
  # Kafka Configuration
  # ============================================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:payment-service-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# ============================================
# JWT CONFIGURATION (Sesion 2)
# ============================================
jwt:
  secret: ${JWT_SECRET:m1S3cr3tK3yJWT_T3csup2025!@#SecureToken}
  expiration: 3600000 # 1 hora en milisegundos

# ============================================
# USER SERVICE CLIENT
# ============================================
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

# ============================================
# CATALOG SERVICE CLIENT
# ============================================
catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}

# ============================================
# ORDER SERVICE CLIENT
# ============================================
order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}

# ============================================
# PAYMENT SERVICE CLIENT
# ============================================
payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

# ============================================
# RESILIENCE4J (Sesión 3)
# ============================================
resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000 # 10 segundos en OPEN
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1000 # 1 segundo entre reintentos

# ============================================
# OBSERVABILIDAD - Módulo 5 Sesión 1
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus # ← Agregar prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  # Métricas Prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  # Trazas distribuidas
  tracing:
    sampling:
      probability: 1.0 # 1.0 = 100% de trazas (solo para desarrollo). En producción usar 0.1 (10%)
    # Configuración de Zipkin para trazas distribuidas
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  # Tags comunes en todas las métricas
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true # Habilitar histograma de latencia

# ============================================
# LOGGING
# ============================================
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  level:
    "[com.tecsup.app.micro.pago]": ${LOG_LEVEL:INFO}
    "[org.hibernate.SQL]": ${SQL_LOG_LEVEL:WARN}
